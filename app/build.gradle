    defaultConfig {
        applicationId "com.lovejoy777.boatlog"
        minSdk 21
        targetSdk 35
        versionCode 29
        versionName "3.0.0"
        multiDexEnabled true
        resValue "string", "google_maps_key", "AIzaSyCwxCtpRWfrqYzeEo3iVnktnPm-Ai9R4Tk"
        manifestPlaceholders = [ mapApiKeyValue: "AIzaSyBHRAlL9xDEPjEFpICj_E5TmobVjO3rfxc", driveApiKeyValue: "183114782898" ]
    }

    buildTypes {
        release {
            minifyEnabled true
          // shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
